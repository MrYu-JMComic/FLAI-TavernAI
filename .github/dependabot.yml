version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
    groups:
      backend-minor:
        update-types:
          - minor
          - patch
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend-minor:
        update-types:
          - minor
          - patch
  - package-ecosystem: npm
    directory: /packaging/windows
    schedule:
      interval: weekly
    groups:
      packaging-minor:
        update-types:
          - minor
          - patch
